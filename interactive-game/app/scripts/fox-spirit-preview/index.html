<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Fox spirit · developer preview</title>
  <style>
    body {
      margin: 0;
      background: #18241f;
      color: #ddd9c5;
      font: 14px system-ui;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
    }
    iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 1px solid #556156;
      transform-origin: top left;
    }
    #frame {
      width: 390px;
      height: 844px;
      margin: 0 auto 24px;
    }
  </style>
  <nav>
    <strong>Real renderer · phone viewport</strong>
    <label
      >Guardian
      <select id="guardian"></select
    ></label>
    <button id="record" onclick="recordReveal()">Record this awakening</button>
    <span id="record-status"></span><a id="recording" hidden>Save recording</a>
    <button
      onclick="
        guardian = 'fox';
        start('centre');
      "
    >
      Fox
    </button>
    <button
      onclick="
        guardian = 'tree';
        start('centre');
      "
    >
      Gilded Root
    </button>
    <button onclick="start('centre')">Centre entrance</button>
    <button onclick="start('left')">Small / upper left</button>
    <button onclick="start('right')">Large / lower right</button>
    <button onclick="resize(390, 844)">Portrait</button>
    <button onclick="resize(844, 390)">Landscape</button>
    <button onclick="resize(375, 667)">Small phone</button>
    <button
      onclick="document.getElementById('phone').src = 'stage.html?capture=1'"
    >
      GLB capture fixture
    </button>
  </nav>
  <div id="frame">
    <iframe id="phone" title="Fox spirit preview" src="stage.html"></iframe>
  </div>
  <script>
    const characters = [
      "fox",
      "tree",
      "moon",
      "guardian",
      "seed",
      "skull",
      "raven",
      "owl",
      "stag",
      "hare",
      "fork",
      "ember",
      "knots",
      "host",
      "door",
    ];
    let guardian =
      new URLSearchParams(location.search).get("guardian") || "fox";
    if (!characters.includes(guardian)) guardian = "fox";
    const chooser = document.getElementById("guardian");
    for (const key of characters) {
      const option = new Option(key, key);
      chooser.add(option);
    }
    chooser.value = guardian;
    chooser.onchange = () => {
      guardian = chooser.value;
      start("centre");
    };
    function start(origin) {
      document.getElementById("phone").src =
        "stage.html?guardian=" + guardian + "&origin=" + origin;
    }
    async function recordReveal() {
      const button = document.getElementById("record"),
        status = document.getElementById("record-status"),
        link = document.getElementById("recording"),
        key = guardian;
      button.disabled = true;
      link.hidden = true;
      status.textContent = "Preparing recording…";
      let stream;
      try {
        const frame = document.getElementById("phone");
        const loaded = new Promise((resolve) =>
          frame.addEventListener("load", resolve, { once: true }),
        );
        start("centre");
        await loaded;
        const deadline = Date.now() + 20000;
        let replay;
        while (Date.now() < deadline) {
          replay = frame.contentDocument.querySelector(
            '[aria-label="Replay awakening"]',
          );
          if (replay && !replay.disabled) break;
          await new Promise((resolve) => setTimeout(resolve, 100));
        }
        if (!replay || replay.disabled)
          throw Error("Stage did not become ready");
        const canvas = frame.contentDocument.querySelector("canvas");
        stream = canvas.captureStream(24);
        const type = [
          "video/webm;codecs=vp9",
          "video/webm;codecs=vp8",
          "video/webm",
        ].find((t) => MediaRecorder.isTypeSupported(t));
        const recorder = new MediaRecorder(stream, {
            mimeType: type,
            videoBitsPerSecond: 2000000,
          }),
          chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data.size) chunks.push(e.data);
        };
        const done = new Promise((resolve) => (recorder.onstop = resolve));
        recorder.start();
        replay.click();
        status.textContent = "Recording 11 seconds · keep this tab visible";
        await new Promise((resolve) => setTimeout(resolve, 11000));
        recorder.stop();
        await done;
        if (link.href.startsWith("blob:")) URL.revokeObjectURL(link.href);
        link.href = URL.createObjectURL(
          new Blob(chunks, { type: recorder.mimeType }),
        );
        link.download = "hollow-court-" + key + "-reveal.webm";
        link.textContent = "Save recording · " + key;
        link.hidden = false;
        status.textContent = "Recording ready";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        stream?.getTracks().forEach((t) => t.stop());
        button.disabled = false;
      }
    }
    let viewportWidth = 390,
      viewportHeight = 844;
    function resize(w, h) {
      viewportWidth = w;
      viewportHeight = h;
      const f = document.getElementById("phone");
      f.style.width = w + "px";
      f.style.height = h + "px";
      const scale = Math.min(
        1,
        (innerWidth - 32) / w,
        (innerHeight -
          document.querySelector("nav").getBoundingClientRect().height -
          24) /
          h,
      );
      f.style.transform = `scale(${scale})`;
      document.getElementById("frame").style.width = w * scale + "px";
      document.getElementById("frame").style.height = h * scale + "px";
    }
    addEventListener("resize", () => resize(viewportWidth, viewportHeight));
    resize(viewportWidth, viewportHeight);
    start("centre");
  </script>
</html>
