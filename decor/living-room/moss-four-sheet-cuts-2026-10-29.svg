<text x="20" y="476" font-size="12">Rounded target sections: sink run 29 × 72 minus cutout; dishwasher 26 × 25; stove sides 25.5 × 29 and 15 × 29 in.</text>
<text x="20" y="497" font-size="12">Coffee: C1 + B4 = 22 × 44. Other: D1 + B5 = 20 × 40. Desk: A3 + B3 + C4 + D4 + D5 = 49 × 6 in.</text>
<text x="20" y="518" font-size="12">DW: A4 + B2 form 26 × 18; D3 + C3 form 26 × 7. Left stove: D2 + A2. Beige blank areas are spare.</text>
